<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>捲仔的手繪明信片</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.5;
      background: #F9FCFA;
      color: #333;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #A8D8B9;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      color: #1B813E;
    }
    nav a {
      margin-left: 16px;
      text-decoration: none;
      color: #1B813E;
      font-weight: 600;
    }
    nav a:hover {
      color: #5DAC81;
    }
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #A8D8B9, #fff);
    }
    .hero h2 {
      font-size: 28px;
      color: #1B813E;
    }
    .hero p {
      max-width: 600px;
      margin: 12px auto;
      color: #555;
    }
    .btn {
      display: inline-block;
      background: #5DAC81;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 16px;
    }
    .btn:hover { background: #1B813E; }
    .wrap {
      max-width: 960px;
      margin: auto;
      padding: 40px 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
    }
    iframe {
      width: 100%;
      height: 1200px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 捲仔的手繪明信片</h1>
    <nav>
      <a href="#works">作品</a>
      <a href="#order">下單</a>
    </nav>
  </header>

  <section class="hero">
    <h2>用水彩凝結時間</h2>
    <p>手繪明信片，屬於你的獨一無二。</p>
    <p>旅行散策、生活雲瞬、亦或是送出重要的心意，讓我為你，細筆描繪。</p>
    <a href="#order" class="btn">下單去</a>
  </section>

  <div id="works" class="wrap">
    <h2>🌿 作品 </h2>
    <div class="gallery">
      <img src="IMG_9302.jpeg" alt="作品1">
      <img src="IMG_9944.jpeg" alt="作品2">
      <img src="IMG_0646.jpeg" alt="作品3">
    </div>
  </div>

  <div id="order" class="wrap">
    <h2>📝 下單表單</h2>
    <iframe src="postcard-order.html"></iframe>
  </div>

  <footer>
    © 2025 捲仔的手繪明信片 ｜ Made with 💚
  </footer>
</body>
</html>
