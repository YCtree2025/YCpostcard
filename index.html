<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>捲仔手繪明信片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {--bg:#F9FCFA;--card:#FFFFFF;--ink:#2F3131;--muted:#646A6A;--brand:#5DAC81;--brand-50:#EAF6EF;--brand-100:#D8EFE3;--brand-dark:#1B813E;--ring:#A8D8B9}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 'Noto Sans TC','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all}
  a{text-decoration:none;color:inherit}
  /* ===== Header ===== */
  header{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--brand-100);z-index:20}
  header .inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px}
  h1{font-size:20px;margin:0;color:var(--brand-dark)}
  /* renaming to avoid conflict with slider controls */
  .topnav{display:flex;gap:16px;align-items:center;margin-left:auto}
  .topnav a{color:var(--brand-dark);font-weight:600}
  .topnav a:hover{color:var(--brand)}
  .lang-inline{display:flex;gap:10px;align-items:center}
  .lang-link{padding:6px 10px;border-radius:999px;font-weight:700;color:var(--brand-dark);opacity:.7;text-decoration:none}
  .lang-link:hover{background:var(--brand-50);opacity:1}
  .lang-link.active{background:var(--brand-50);opacity:1}

  .hero{max-width:1100px;margin:0 auto;padding:52px 24px 28px}
  .hero h2{font-size:30px;margin:0 0 10px;color:var(--brand-dark)}
  .hero p{margin:0;color:var(--muted);font-size:16px}

  .main{max-width:1100px;margin:0 auto;padding:16px 24px 44px;display:grid;grid-template-columns:2fr 1fr;gap:24px}
  @media(max-width:900px){.main{grid-template-columns:1fr}}

  /* ===== Card ===== */
  .card{background:linear-gradient(180deg,#fff, var(--brand-50));border:0;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  .card h2{margin:0;padding:16px 18px;border-bottom:0;background:var(--brand-50);border-top-left-radius:18px;border-top-right-radius:18px;font-size:18px;color:var(--brand-dark)}
  .card .body{padding:18px}

  /* ===== Form ===== */
  label{font-weight:700;font-size:14px;display:block;margin:6px 0 4px;color:var(--brand-dark)}
  .addon-title{font-weight:600;font-size:13px}
  .subtle{font-size:13px;color:var(--muted)}
  input,select,textarea,button{width:100%;padding:12px 14px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--brand-100)}
  input:focus,select:focus,textarea:focus{outline:3px solid var(--ring);box-shadow:inset 0 0 0 0 transparent}
  .grid{display:grid;gap:12px}
  .grid.two{grid-template-columns:1fr 1fr}
  @media(max-width:640px){.grid.two{grid-template-columns:1fr}}

  .switch{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;padding:12px 14px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.03), inset 0 0 0 1px var(--brand-100)}
  .muted{color:var(--muted);font-size:12px}

  /* ===== Slider ===== */
  .slider{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.10)}
  .slides{position:relative;height:0;padding-top:66%;}
  .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
  .slide.active{opacity:1}
  .slider-nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.85);width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:20px;line-height:36px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .slider-nav.prev{left:10px}
  .slider-nav.next{right:10px}
  .dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
  .dots button{width:8px;height:8px;border-radius:999px;border:0;background:rgba(255,255,255,.7);cursor:pointer}
  .dots button.active{background:#fff}
  .gallery img{width:100%;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.10)}

  .sticky-total{position:sticky;bottom:16px;margin-top:8px}
  .total{display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--brand),#4da774);color:#fff;border-radius:18px;padding:16px 16px 12px}
  .total .mainline{display:flex;justify-content:space-between;align-items:center}
  .total .mainline b{font-size:20px}
  #detailBox{display:none;background:#fff;color:var(--ink);border-radius:12px;padding:12px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
  #toggleDetail{background:#fff;color:var(--brand-dark);border:0;border-radius:10px;cursor:pointer;padding:8px 12px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:14px;padding:13px 18px;cursor:pointer;transition:.2s;box-shadow:0 6px 14px rgba(27,129,62,.18)}
  .btn:hover{background:var(--brand-dark)}
  .no-break{white-space:nowrap}
  .break-ok{word-break:keep-all}
  @media(max-width:380px){ .sm-break br{display:block} }
  footer{text-align:center;padding:28px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1 id="i-brand">🎨 捲仔 手繪明信片</h1>
    <div class="topnav">
      <a href="#order" id="i-nav-order">下單</a>
      <a href="#works" id="i-nav-works">作品</a>
      <nav class="lang-inline" id="langInline">
        <a href="#" data-lang="zh" class="lang-link active">繁</a>
        <a href="#" data-lang="en" class="lang-link">EN</a>
        <a href="#" data-lang="fr" class="lang-link">FR</a>
      </nav>
    </div>
  </div>
</header>

<section class="hero">
  <h2 id="i-hero-title">用水彩凝結時間</h2>
  <p id="i-hero-text">每張手繪明信片，都是屬於你的獨一無二。<br>旅行回憶、生活記實、亦或是送出重要的心意，讓我為你細筆描繪。</p>
</section>

<section class="main">
  <!-- Left: Order Form -->
  <section class="card" id="order">
    <h2 id="i-form-title">下單資訊</h2>
    <div class="body grid" style="gap:16px">
      <div class="grid two">
        <div><label id="i-name-label">姓名 *</label><input id="name" placeholder="王小明 / Jane Doe"></div>
        <div><label id="i-email-label">Email *</label><input id="email" type="email" placeholder="you@example.com"></div>
      </div>
      <div class="grid two">
        <div><label id="i-ig-label">Instagram</label><input id="ig" placeholder="@yourhandle"></div>
        <div>
          <label id="i-region-label">寄送地區 *</label>
          <select id="region">
            <option value="LU" id="i-region-lu">盧森堡 (LU)</option>
            <option value="EU" id="i-region-eu">歐洲 (EU)</option>
            <option value="TW" id="i-region-tw">台灣 (TW)</option>
            <option value="WORLD" id="i-region-world">全球 (WORLD)</option>
          </select>
        </div>
      </div>
      <div>
        <label id="i-address-label">寄送地址 *</label>
        <textarea id="address" rows="3" placeholder="收件人、地址、郵遞區號、電話"></textarea>
      </div>
      <div class="grid two">
        <div>
          <label id="i-style-label">風格 *</label>
          <select id="style">
            <option value="watercolor" id="i-style-water">水彩 (€20)</option>
            <option value="line" id="i-style-line">純線稿 (€20)</option>
          </select>
        </div>
        <div>
          <label id="i-qty-label">數量 *</label>
          <input id="qty" type="number" min="1" value="1">
        </div>
      </div>
      <div class="grid two">
        <div class="switch">
          <div><div id="i-person-title" class="no-break addon-title">加畫人/寵物</div><div class="muted" id="i-person-note">+ €5 / 張</div></div>
          <select id="person"><option value="0" id="i-no">否</option><option value="1" id="i-yes">是</option></select>
        </div>
        <div class="switch">
          <div><div id="i-bg-title" class="no-break addon-title">背景<wbr>細節</div><div class="muted" id="i-bg-note">+ €3 / 張</div></div>
          <select id="bg"><option value="0" id="i-no2">否</option><option value="1" id="i-yes2">是</option></select>
        </div>
      </div>
      <div>
        <label id="i-note-label">備註 / 氛圍關鍵字</label>
        <textarea id="note" rows="3" placeholder="例：溫暖、旅行、薄霧清晨、加入日期 2025.10.10 等"></textarea>
      </div>
      <div>
        <button class="btn" id="submit">送出訂單</button>
        <div id="submitMsg" class="muted" style="margin-top:8px;display:none">訂單已送出，請選擇付款方式：</div>
        <div id="paySection" style="display:none;gap:8px;margin-top:8px" class="grid">
          <button id="payAuto">信用卡（自動計金額）</button>
          <button id="payPaypal">PayPal</button>
          <button id="payRevolut">Revolut</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Right: Works + Sticky Total -->
  <aside>
    <section class="card" id="works">
      <h2 id="i-works-title">作品展示</h2>
      <div class="body">
        <div class="slider" id="slider">
          <div class="slides">
            <img src="IMG_9302.jpeg" alt="work1" class="slide active">
            <img src="IMG_9944.jpeg" alt="work2" class="slide">
            <img src="IMG_0646.jpeg" alt="work3" class="slide">
          </div>
          <button class="slider-nav prev" aria-label="Prev" id="slidePrev">‹</button>
          <button class="slider-nav next" aria-label="Next" id="slideNext">›</button>
          <div class="dots" id="slideDots"></div>
        </div>
      </div>
    </section>

    <div class="sticky-total">
      <div class="total">
        <div class="mainline"><span id="i-total-label">總計</span><b id="t-total">€0.00</b></div>
        <button id="toggleDetail">顯示明細 ▾</button>
        <div id="detailBox">
          <div id="t-sub">小計：€0.00</div>
          <div id="t-add">加購：€0.00</div>
          <div id="t-ship">運費：€0.00</div>
        </div>
      </div>
    </div>
  </aside>
</section>

<footer id="i-footer">© 2025 Ya‑Sin 手繪明信片 ｜ Made with 💚</footer>

<script>
// ===== Helpers =====
const $ = id => document.getElementById(id);

// ===== i18n =====
const I18N={
  zh:{label:'繁中',brand:'🎨 Ya‑Sin 手繪明信片',navOrder:'下單',navWorks:'作品',
      heroTitle:'用水彩凝結時間',heroLines:['每張手繪明信片，都是屬於你的獨一無二。','旅行回憶、生活記實、亦或是送出重要的心意，讓我為你細筆描繪。'],
      formTitle:'下單資訊',name:'姓名 *',email:'Email *',ig:'Instagram',region:'寄送地區 *',address:'寄送地址 *',style:'風格 *',qty:'數量 *',
      styleWater:'水彩 (€20)',styleLine:'純線稿 (€20)',person:'加畫人/寵物',personNote:'+ €5 / 張',bg:'背景細節',bgNote:'+ €3 / 張',
      yes:'是',no:'否',noteLabel:'備註 / 氛圍關鍵字',submit:'送出訂單',afterSubmit:'訂單已送出，請選擇付款方式：',
      works:'作品展示',total:'總計',detailShow:'顯示明細 ▾',detailHide:'隱藏明細 ▴',sub:'小計：',add:'加購：',ship:'運費：',
      phName:'王小明 / Jane Doe',phEmail:'you@example.com',phIG:'@yourhandle',phAddr:'收件人、地址、郵遞區號、電話',phNote:'例：溫暖、旅行、薄霧清晨、加入日期 2025.10.10 等',
      regionLU:'盧森堡 (LU)',regionEU:'歐洲 (EU)',regionTW:'台灣 (TW)',regionWORLD:'全球 (WORLD)',
      payCard:'信用卡（自動計金額）'
  },
  en:{label:'EN',brand:'🎨 Ya‑Sin Postcards',navOrder:'Order',navWorks:'Works',
      heroTitle:'Captured in watercolor',heroLines:['Each hand‑painted postcard is uniquely yours.','Travel memories, everyday moments, or heartfelt messages — let me capture them in watercolor lines.'],
      formTitle:'Order details',name:'Name *',email:'Email *',ig:'Instagram',region:'Shipping region *',address:'Shipping address *',style:'Style *',qty:'Quantity *',
      styleWater:'Watercolor (€20)',styleLine:'Line art (€20)',person:'Add people/pets',personNote:'+ €5 / card',bg:'Background details',bgNote:'+ €3 / card',
      yes:'Yes',no:'No',noteLabel:'Notes / keywords',submit:'Submit order',afterSubmit:'Order sent. Please choose a payment method:',
      works:'Portfolio',total:'Total',detailShow:'Show breakdown ▾',detailHide:'Hide breakdown ▴',sub:'Subtotal: ',add:'Add‑ons: ',ship:'Shipping: ',
      phName:'Your name',phEmail:'you@example.com',phIG:'@yourhandle',phAddr:'Recipient, address, postal code, phone',phNote:'e.g., warm, travel, misty morning, add date 2025‑10‑10',
      regionLU:'Luxembourg (LU)',regionEU:'Europe (EU)',regionTW:'Taiwan (TW)',regionWORLD:'World (GLOBAL)',
      payCard:'Card (auto‑total)'
  },
  fr:{label:'FR',brand:'🎨 Cartes postales Ya‑Sin',navOrder:'Commander',navWorks:'Œuvres',
      heroTitle:'Saisir le temps en aquarelle',heroLines:["Chaque carte postale peinte à la main est unique pour vous.","Souvenirs de voyage, instants de vie ou messages précieux — je les dessine avec soin."],
      formTitle:'Détails de la commande',name:'Nom *',email:'Email *',ig:'Instagram',region:'Région d’envoi *',address:'Adresse d’envoi *',style:'Style *',qty:'Quantité *',
      styleWater:'Aquarelle (€20)',styleLine:'Dessin au trait (€20)',person:'Ajouter personnes/animaux',personNote:'+ €5 / carte',bg:'Détails de fond',bgNote:'+ €3 / carte',
      yes:'Oui',no:'Non',noteLabel:'Remarques / mots‑clés',submit:'Envoyer la commande',afterSubmit:"Commande envoyée. Choisissez un moyen de paiement :",
      works:'Galerie',total:'Total',detailShow:'Afficher le détail ▾',detailHide:'Masquer le détail ▴',sub:'Sous‑total : ',add:'Options : ',ship:'Port : ',
      phName:'Votre nom',phEmail:'vous@example.com',phIG:'@votrecompte',phAddr:'Destinataire, adresse, code postal, téléphone',phNote:'ex. chaleureux, voyage, matin brumeux, ajouter la date 2025‑10‑10',
      regionLU:'Luxembourg (LU)',regionEU:'Europe (UE)',regionTW:'Taïwan (TW)',regionWORLD:'Monde (GLOBAL)',
      payCard:'Carte (total auto)'
  }
};

let currentLang='zh';
function applyLang(lang){
  const t=I18N[lang]; currentLang=lang;
  // header & hero
  $('i-brand').textContent=t.brand;
  $('i-nav-order').textContent=t.navOrder; $('i-nav-works').textContent=t.navWorks;
  $('i-hero-title').textContent=t.heroTitle; $('i-hero-text').innerHTML=t.heroLines.join('<br>');
  // form labels
  $('i-form-title').textContent=t.formTitle; $('i-name-label').textContent=t.name; $('i-email-label').textContent=t.email; $('i-ig-label').textContent=t.ig; $('i-region-label').textContent=t.region; $('i-address-label').textContent=t.address; $('i-style-label').textContent=t.style; $('i-qty-label').textContent=t.qty;
  $('i-style-water').textContent=t.styleWater; $('i-style-line').textContent=t.styleLine;
  $('i-person-title').textContent=t.person; $('i-person-note').textContent=t.personNote; $('i-bg-title').textContent=t.bg; $('i-bg-note').textContent=t.bgNote;
  $('i-yes').textContent=t.yes; $('i-no').textContent=t.no; $('i-yes2').textContent=t.yes; $('i-no2').textContent=t.no;
  $('i-note-label').textContent=t.noteLabel; $('submit').textContent=t.submit; $('submitMsg').textContent=t.afterSubmit;
  $('i-works-title').textContent=t.works; $('i-total-label').textContent=t.total;
  $('toggleDetail').textContent = (document.getElementById('detailBox').style.display==='block' ? t.detailHide : t.detailShow);
  // placeholders
  $('name').placeholder=t.phName; $('email').placeholder=t.phEmail; $('ig').placeholder=t.phIG; $('address').placeholder=t.phAddr; $('note').placeholder=t.phNote;
  // regions
  $('i-region-lu').textContent=t.regionLU; $('i-region-eu').textContent=t.regionEU; $('i-region-tw').textContent=t.regionTW; $('i-region-world').textContent=t.regionWORLD;
  // payments
  $('payAuto').textContent=t.payCard;
}

// Language switch (top-right)
const langBar=document.getElementById('langInline');
langBar.addEventListener('click',(e)=>{
  const a=e.target.closest('.lang-link'); if(!a) return; e.preventDefault();
  document.querySelectorAll('.lang-link').forEach(el=>el.classList.toggle('active',el===a));
  applyLang(a.dataset.lang);
  recalc();
});

// ===== Pricing =====
const CONFIG={ FORMSPREE_ENDPOINT:'https://formspree.io/f/xzzjzwba', PAYPAL_LINK:'https://paypal.me/YCpostcard', REVOLUT_LINK:'https://revolut.me/yasinla9g', STRIPE_CHECKOUT_ENDPOINT:'' };
const PRICING={watercolor:20,line:20,person:5,bg:3,ship:{LU:1.5,EU:2.0,TW:2.5,WORLD:3.0}};
const euro=n=>`€${Number(n).toFixed(2)}`;

function recalc(){
  const qty = Math.max(1, parseInt(($('qty').value||'1'),10));
  const style = $('style').value;
  const base = (PRICING[style]||0)*qty;
  const perAdd = ( ($('person').value==='1'?PRICING.person:0) + ($('bg').value==='1'?PRICING.bg:0) );
  const add = perAdd * qty;
  const ship = PRICING.ship[$('region').value]||0;
  const total = base + add + ship;
  $('t-total').textContent = euro(total);
  $('t-sub').textContent   = (I18N[currentLang].sub  || '小計：') + euro(base);
  $('t-add').textContent   = (I18N[currentLang].add  || '加購：') + euro(add);
  $('t-ship').textContent  = (I18N[currentLang].ship || '運費：') + euro(ship);
}

['change','input'].forEach(ev=>{
  document.body.addEventListener(ev,e=>{
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') recalc();
  });
});

// ===== Slider =====
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  const dotsWrap=document.getElementById('slideDots');
  let idx=0, timer=null;
  function go(i){ idx=(i+slides.length)%slides.length; slides.forEach((s,j)=>s.classList.toggle('active',j===idx)); dotsWrap.querySelectorAll('button').forEach((d,j)=>d.classList.toggle('active',j===idx)); }
  slides.forEach((_,i)=>{ const b=document.createElement('button'); if(i===0) b.classList.add('active'); dotsWrap.appendChild(b); b.addEventListener('click',()=>{ go(i); restart(); }); });
  document.getElementById('slidePrev').addEventListener('click',()=>{ go(idx-1); restart(); });
  document.getElementById('slideNext').addEventListener('click',()=>{ go(idx+1); restart(); });
  function autoplay(){ timer=setInterval(()=>go(idx+1), 3500); }
  function restart(){ clearInterval(timer); autoplay(); }
  autoplay();
})();

// initial calc & language
applyLang('zh');
recalc();

// ===== Order submit & payment =====
function buildOrder(){
  const lines=[
    '[Postcard Order]',
    'Name: '+$('name').value,
    'Email: '+$('email').value,
    'IG: '+$('ig').value,
    'Region: '+$('region').value,
    'Address: '+$('address').value,
    'Style: '+$('style').value,
    'Qty: '+$('qty').value,
    'People/Pets: '+($('person').value==='1'?'Yes':'No'),
    'Background details: '+($('bg').value==='1'?'Yes':'No'),
    'Total: '+$('t-total').textContent
  ];
  return lines.join('\n');
}
function getTotalAmount(){ const t=$('t-total').textContent||''; return (t.match(/€([0-9]+(?:\.[0-9]{1,2})?)/)||[])[1]||'0'; }

$('submit').addEventListener('click', async ()=>{
  const name=$('name').value.trim(); const email=$('email').value.trim(); const address=$('address').value.trim();
  const t = I18N[currentLang];
  if(!name){alert(currentLang==='en'?'Please enter name':currentLang==='fr'?'Veuillez saisir le nom':'請輸入姓名');return}
  if(!(email.includes('@')&&email.includes('.'))){alert(currentLang==='en'?'Please enter a valid email':currentLang==='fr'?'Veuillez saisir un email valide':'請輸入有效 Email');return}
  if(!address){alert(currentLang==='en'?'Please enter shipping address':currentLang==='fr'?'Veuillez saisir l\'adresse d\'envoi':'請輸入寄送地址');return}
  try{
    await fetch(CONFIG.FORMSPREE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,summary:buildOrder(),totalEUR:getTotalAmount()})});
    $('submitMsg').style.display='block'; $('paySection').style.display='grid';
  }catch(e){ alert(currentLang==='en'?'Submit failed, try again later':currentLang==='fr'?'Échec de l\'envoi, réessayez plus tard':'表單提交失敗，請稍後再試'); }
});

function openPay(url){ if(!url){ alert('Missing link'); return } const amt=getTotalAmount(); let final=url; if(/paypal\.me\//i.test(url)&&amt){final=url.replace(/\/$/,'')+'/'+amt} if(/revolut\.me\//i.test(url)&&amt){final=url+(url.includes('?')?'&':'?')+'amount='+amt} window.open(final,'_blank'); }
$('payPaypal').addEventListener('click',()=>openPay(CONFIG.PAYPAL_LINK));
$('payRevolut').addEventListener('click',()=>openPay(CONFIG.REVOLUT_LINK));
$('payAuto').addEventListener('click', async ()=>{ if(!CONFIG.STRIPE_CHECKOUT_ENDPOINT){ alert('Stripe endpoint not set'); return } const name=$('name').value.trim(); const email=$('email').value.trim(); const amount=getTotalAmount(); try{ const res=await fetch(CONFIG.STRIPE_CHECKOUT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNo:'YSP-'+Date.now(),amountEUR:amount,name,email})}); const data=await res.json(); if(data.url) location.href=data.url; else throw new Error('no url'); }catch(e){ alert('建立刷卡頁失敗，請改用 PayPal / Revolut'); }});

// Toggle detail
const toggle=$('toggleDetail');
toggle.addEventListener('click',()=>{ const box=$('detailBox'); const open=box.style.display==='block'; box.style.display=open?'none':'block'; toggle.textContent=open?I18N[currentLang].detailShow:I18N[currentLang].detailHide; });
</script>
</body>
</html>
